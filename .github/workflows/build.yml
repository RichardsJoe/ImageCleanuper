name: Test and build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases on version tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.3.4

      - name: Build PyInstaller from source (own launcher, fewer antivirus false positives)
        # The prebuilt PyInstaller launcher is shared by many programs, including malware, so
        # antivirus and Google Safe Browsing often flag anything built with it. Compiling the
        # launcher here gives this app its own.
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: pip install --no-binary pyinstaller --no-cache-dir pyinstaller==6.11.1

      - name: Run tests
        run: python -m pytest -q -rs

      - name: Work out version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('imagecleanuper/__init__.py').read()).group(1))")
            echo "version=${v}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app with PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name ImageCleanuper
          --collect-data customtkinter --collect-all pillow_heif run_app.py

      - name: Check the built app starts
        run: |
          $p = Start-Process -FilePath "dist\ImageCleanuper\ImageCleanuper.exe" -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "ImageCleanuper.exe --version exited with $($p.ExitCode)" }
          $p = Start-Process -FilePath "dist\ImageCleanuper\ImageCleanuper.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "ImageCleanuper.exe --selftest exited with $($p.ExitCode)" }

      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\ImageCleanuper.iss

      - name: Check the installer installs per-user (no admin folder)
        run: |
          $setup = Get-ChildItem dist\ImageCleanuper-Setup-*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=install.log" -Wait -PassThru
          Get-Content install.log | Select-String -Pattern "Dest|Directory|dir" | Select-Object -First 15
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\ImageCleanuper\ImageCleanuper.exe"
          if (-not (Test-Path $exe)) { throw "App was not installed to $exe" }
          if (Test-Path "C:\Program Files (x86)\ImageCleanuper") { throw "App was installed to Program Files (x86)" }
          Write-Host "Installed to $exe"

      - name: Scan with Microsoft Defender (fail the build if anything is flagged)
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Host "Defender not available on this machine; skipping"; exit 0 }
          & $mp -SignatureUpdate | Out-Null
          foreach ($target in @("dist\ImageCleanuper", (Get-ChildItem dist\ImageCleanuper-Setup-*.exe).FullName)) {
            Write-Host "Scanning $target"
            & $mp -Scan -ScanType 3 -File (Resolve-Path $target) -DisableRemediation
            if ($LASTEXITCODE -eq 2) { throw "Microsoft Defender flagged $target" }
            if ($LASTEXITCODE -ne 0) { Write-Host "Defender scan could not run (exit $LASTEXITCODE)" }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ImageCleanuper-Setup-${{ steps.ver.outputs.version }}
          path: dist/ImageCleanuper-Setup-*.exe

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ImageCleanuper-Setup-*.exe
          generate_release_notes: true

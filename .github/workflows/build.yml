name: Test and build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases on version tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Work out version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app with PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name ImageCleanuper
          --collect-data customtkinter run_app.py

      - name: Check the built app starts
        run: |
          $p = Start-Process -FilePath "dist\ImageCleanuper\ImageCleanuper.exe" -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "ImageCleanuper.exe --version exited with $($p.ExitCode)" }

      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\ImageCleanuper.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ImageCleanuper-Setup-${{ steps.ver.outputs.version }}
          path: dist/ImageCleanuper-Setup-*.exe

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ImageCleanuper-Setup-*.exe
          generate_release_notes: true

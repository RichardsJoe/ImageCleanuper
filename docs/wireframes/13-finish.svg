<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 620" width="1130" height="620" role="img" aria-label="Finish wireframe"><rect x="0" y="0" width="1130" height="620" fill="#e4e7eb"/><rect x="10" y="10" width="1110" height="600" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.5"/><rect x="10" y="10" width="1110" height="34" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><rect x="11" y="36" width="1108" height="8" fill="#f5f7fa"/><text x="24" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">ImageCleanuper — Finish</text><text x="1050" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">–</text><text x="1074" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">□</text><text x="1098" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">×</text><rect x="11" y="44" width="170" height="565" fill="#eef1f4"/><line x1="181" y1="44" x2="181" y2="609" stroke="#cbd2d9"/><text x="28" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">ImageCleanuper</text><text x="34" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Home</text><text x="34" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Run  (R)</text><text x="34" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Review  (V)</text><rect x="126" y="188" width="30" height="18" rx="9" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.5"/><text x="141" y="201" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2f6fdb" font-weight="bold" text-anchor="middle">37</text><text x="34" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Report  (P)</text><rect x="20" y="264" width="150" height="34" rx="6" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="34" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start">Finish  (F)</text><text x="34" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Restore</text><text x="34" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Settings</text><text x="28" y="574" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7b8794" font-weight="normal" text-anchor="start">Version 0.3 · F1 Hotkeys</text><g transform="translate(170,0)"><text x="60" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">Finish: move originals into your library</text><text x="60" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7b8794" font-weight="normal" text-anchor="start">Do this once, when you're happy with how everything is sorted.</text><text x="60" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2f8f5b" font-weight="normal" text-anchor="start">✓  Backup verified on 14 Nov (2,952 files)</text><text x="60" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2f8f5b" font-weight="normal" text-anchor="start">✓  Accuracy at or above 95% for 6 of 7 checks</text><text x="60" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#b7791f" font-weight="normal" text-anchor="start">!  Scenic is at 88% — you may want one more review round</text><rect x="60" y="280" width="840" height="150" rx="6" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.5"/><text x="80" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">What will happen</text><text x="80" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">• 2,741 originals move into C:\SortedPhotos (fixed photos stay as their fixed version)</text><text x="80" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">• Folders left completely empty are deleted; folders with anything else are left alone</text><text x="80" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">• Every move is logged first, so an interruption can be finished or undone</text><text x="80" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">• Your backup zips stay in C:\MasterPhotoBackup</text><text x="60" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">Type FINISH to confirm:</text><rect x="240" y="452" width="200" height="34" rx="4" fill="#ffffff" stroke="#7b8794" stroke-width="1.5"/><text x="250" y="474.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">FINISH</text><rect x="60" y="540" width="140" height="36" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/><text x="130.0" y="563.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="middle">Cancel  (Esc)</text><rect x="680" y="540" width="220" height="36" rx="6" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="790.0" y="563.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">Move originals  (Enter)</text></g></svg>
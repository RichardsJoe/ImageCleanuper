<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="Restore wireframe"><rect x="0" y="0" width="960" height="620" fill="#e4e7eb"/><rect x="10" y="10" width="940" height="600" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.5"/><rect x="10" y="10" width="940" height="34" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><rect x="11" y="36" width="938" height="8" fill="#f5f7fa"/><text x="24" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">ImageCleanuper — Restore</text><text x="880" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">–</text><text x="904" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">□</text><text x="928" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">×</text><text x="60" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">Get something back</text><rect x="60" y="136" width="840" height="76" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/><text x="84" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Restore everything</text><text x="84" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">Put every original back exactly where it was, from a chosen backup.</text><text x="870" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7b8794" font-weight="normal" text-anchor="end">›</text><rect x="60" y="228" width="840" height="76" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/><text x="84" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Restore a photo or folder</text><text x="84" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">Search by name or original folder and restore just that.</text><text x="870" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7b8794" font-weight="normal" text-anchor="end">›</text><rect x="60" y="320" width="840" height="76" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/><text x="84" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Find an original</text><text x="84" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">Pick a photo in your library and see the untouched file it came from.</text><text x="870" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7b8794" font-weight="normal" text-anchor="end">›</text><text x="60" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">Backups available:  14 Nov 2026 (2,952 files) · 21 Nov 2026 (+38 new)</text><text x="60" y="468" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">Every restore is checked against the backup's fingerprints and never overwrites without asking.</text><rect x="60" y="540" width="120" height="36" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/><text x="120.0" y="563.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="middle">Back  (Esc)</text></svg>
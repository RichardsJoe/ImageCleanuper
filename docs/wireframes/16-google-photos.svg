<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="Add Google Photos wireframe"><rect x="0" y="0" width="960" height="620" fill="#e4e7eb"/><rect x="10" y="10" width="940" height="600" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.5"/><rect x="10" y="10" width="940" height="34" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><rect x="11" y="36" width="938" height="8" fill="#f5f7fa"/><text x="24" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">ImageCleanuper — Add Google Photos</text><text x="880" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">–</text><text x="904" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">□</text><text x="928" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">×</text><text x="60" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">Bring in your Google Photos</text><text x="60" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7b8794" font-weight="normal" text-anchor="start">Google only lets you take your whole library out as an export. It takes three steps.</text><rect x="60" y="160" width="840" height="90" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/><circle cx="96" cy="205" r="18" fill="#f5f7fa" stroke="#2f6fdb" stroke-width="2"/><text x="96" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2f6fdb" font-weight="bold" text-anchor="middle">1</text><text x="130" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Ask Google for an export</text><text x="130" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">Opens Google Takeout with only Google Photos selected. Choose 50 GB zip files.</text><rect x="680" y="174" width="200" height="36" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1.5"/><text x="780.0" y="197.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">Open Google Takeout  ↗</text><text x="880" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2f8f5b" font-weight="normal" text-anchor="end">✓ Requested 14 Nov</text><rect x="60" y="264" width="840" height="90" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/><circle cx="96" cy="309" r="18" fill="#f5f7fa" stroke="#2f6fdb" stroke-width="2"/><text x="96" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2f6fdb" font-weight="bold" text-anchor="middle">2</text><text x="130" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Wait for Google's email</text><text x="130" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">Usually a few hours, sometimes a day or two. You can close the app meanwhile.</text><text x="880" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7b8794" font-weight="normal" text-anchor="end">Waiting for email…</text><rect x="60" y="368" width="840" height="90" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/><circle cx="96" cy="413" r="18" fill="#f5f7fa" stroke="#2f6fdb" stroke-width="2"/><text x="96" y="419" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2f6fdb" font-weight="bold" text-anchor="middle">3</text><text x="130" y="406" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Choose the downloaded zips</text><text x="130" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">Download every zip from the email, then pick them here.</text><rect x="680" y="382" width="200" height="36" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1.5"/><text x="780.0" y="405.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">Choose zip files…</text><text x="880" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2f8f5b" font-weight="normal" text-anchor="end">3 of 3 zips found · 41 GB</text><text x="60" y="498" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">The zips are copied into your backup folder and checked. Google's own dates are used for each photo.</text><rect x="60" y="540" width="140" height="36" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/><text x="130.0" y="563.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="middle">Cancel  (Esc)</text><rect x="680" y="540" width="220" height="36" rx="6" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="790.0" y="563.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">Add to my photos  (Enter)</text></svg>
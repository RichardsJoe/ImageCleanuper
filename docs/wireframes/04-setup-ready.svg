<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="Setup wireframe"><rect x="0" y="0" width="960" height="620" fill="#e4e7eb"/><rect x="10" y="10" width="940" height="600" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.5"/><rect x="10" y="10" width="940" height="34" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><rect x="11" y="36" width="938" height="8" fill="#f5f7fa"/><text x="24" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">ImageCleanuper — Setup</text><text x="880" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">–</text><text x="904" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">□</text><text x="928" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">×</text><text x="800" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7b8794" font-weight="normal" text-anchor="end">Step 3 of 3</text><text x="60" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">Ready for your first run</text><text x="60" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7b8794" font-weight="normal" text-anchor="start">Here's what happens next. You can stop at any time and pick up later.</text><circle cx="84" cy="188" r="18" fill="#f5f7fa" stroke="#2f6fdb" stroke-width="2"/><text x="84" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2f6fdb" font-weight="bold" text-anchor="middle">1</text><text x="118" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Back up</text><text x="118" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">Every photo and video is zipped and checked. Nothing is touched before this.</text><circle cx="84" cy="262" r="18" fill="#f5f7fa" stroke="#2f6fdb" stroke-width="2"/><text x="84" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2f6fdb" font-weight="bold" text-anchor="middle">2</text><text x="118" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Analyze</text><text x="118" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">Dates, scans, rotation, faces, pets, categories, duplicates.</text><circle cx="84" cy="336" r="18" fill="#f5f7fa" stroke="#2f6fdb" stroke-width="2"/><text x="84" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2f6fdb" font-weight="bold" text-anchor="middle">3</text><text x="118" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Name people</text><text x="118" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">You'll see one person at a time and type their name, about 20 people.</text><circle cx="84" cy="410" r="18" fill="#f5f7fa" stroke="#2f6fdb" stroke-width="2"/><text x="84" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2f6fdb" font-weight="bold" text-anchor="middle">4</text><text x="118" y="406" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Check the plan</text><text x="118" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">A visual report shows where everything would go. Nothing moves until you approve.</text><text x="60" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">Estimated time: about 1–2 hours for 2,952 photos. The PC stays awake while it works.</text><rect x="60" y="540" width="120" height="36" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/><text x="120.0" y="563.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="middle">Back  (←)</text><rect x="700" y="540" width="200" height="36" rx="6" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="800.0" y="563.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">Start first run  (Enter)</text></svg>
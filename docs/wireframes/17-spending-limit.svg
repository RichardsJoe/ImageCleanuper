ont-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2f6fdb" font-weight="bold" text-anchor="middle">37</text><text x="34" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cbd2d9" font-weight="normal" text-anchor="start">Report  (P)</text><text x="34" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cbd2d9" font-weight="normal" text-anchor="start">Finish  (F)</text><text x="34" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cbd2d9" font-weight="normal" text-anchor="start">Restore</text><text x="34" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cbd2d9" font-weight="normal" text-anchor="start">Settings</text><text x="28" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7b8794" font-weight="normal" text-anchor="start">Pause the run to</text><text x="28" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7b8794" font-weight="normal" text-anchor="start">use the other pages.</text><text x="28" y="574" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7b8794" font-weight="normal" text-anchor="start">Version 0.3 · F1 Hotkeys</text><g transform="translate(170,0)"><text x="60" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">Working on your photos</text><rect x="220" y="160" width="480" height="14" rx="7.0" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.5"/><rect x="220" y="160" width="355.2" height="14" rx="7.0" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="60" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Analyze</text><rect x="-170" y="0" width="1130" height="620" fill="#1f2933" opacity="0.35"/><rect x="200" y="150" width="560" height="330" rx="10" fill="#ffffff" stroke="#7b8794" stroke-width="1.5"/><text x="228" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#1f2933" font-weight="bold" text-anchor="start">Claude spending limit reached</text><text x="228" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7b8794" font-weight="normal" text-anchor="start">You've spent $5.00 of your $5.00 limit this month.</text><text x="228" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7b8794" font-weight="normal" text-anchor="start">Claude gave a second opinion on 1,180 unsure photos.</text><text x="228" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">142 unsure photos are left. What should happen to them?</text><rect x="228" y="306" width="504" height="40" rx="6" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="480.0" y="331.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">1   Continue with the free local models   (they go to Needs Review)</text><rect x="228" y="356" width="504" height="40" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1.5"/><text x="480.0" y="381.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">2   Raise the limit by $5 and keep using Claude</text><rect x="228" y="406" width="504" height="40" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/><text x="480.0" y="431.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="middle">3   Pause the run</text><text x="228" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7b8794" font-weight="normal" text-anchor="start">No answer in 5 minutes? The run continues with the free local models.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="Setup wireframe"><rect x="0" y="0" width="960" height="620" fill="#e4e7eb"/><rect x="10" y="10" width="940" height="600" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.5"/><rect x="10" y="10" width="940" height="34" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><rect x="11" y="36" width="938" height="8" fill="#f5f7fa"/><text x="24" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">ImageCleanuper — Setup</text><text x="880" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">–</text><text x="904" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">□</text><text x="928" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">×</text><text x="800" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7b8794" font-weight="normal" text-anchor="end">Step 1 of 3</text><text x="60" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">Where are your photos?</text><text x="60" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7b8794" font-weight="normal" text-anchor="start">Add every top folder that has photos in it. Subfolders are searched automatically, however deep.</text><rect x="60" y="160" width="840" height="42" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/><text x="80" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">📁  C:\Users\Joe\Pictures</text><text x="640" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">2,140 photos · 96 videos</text><rect x="820" y="166" width="66" height="30" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/><text x="853.0" y="186.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="middle">Remove</text><rect x="60" y="212" width="840" height="42" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/><text x="80" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">📁  D:\Old Phone Backup</text><text x="640" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">812 photos · 40 videos</text><rect x="820" y="218" width="66" height="30" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/><text x="853.0" y="238.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="middle">Remove</text><rect x="60" y="274" width="190" height="36" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1.5"/><text x="155.0" y="297.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">+ Add a folder  (A)</text><rect x="60" y="340" width="840" height="110" rx="6" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.5"/><text x="84" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Also have photos in Google Photos?  (optional)</text><text x="84" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">The app helps you export them and adds them to your backup like any folder.</text><text x="84" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">You can also do this later from Home.</text><rect x="680" y="362" width="200" height="36" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1.5"/><text x="780.0" y="385.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">Add Google Photos…  (G)</text><text x="60" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="start">Old scanned photos are found automatically — no need to point them out.</text><rect x="60" y="540" width="120" height="36" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/><text x="120.0" y="563.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7b8794" font-weight="normal" text-anchor="middle">Back  (←)</text><rect x="740" y="540" width="160" height="36" rx="6" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.5"/><text x="820.0" y="563.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">Next  (Enter)</text></svg>